<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<title>学マス楽曲レポート</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--
  再生回数は GitHub Actions(.github/workflows/update.yml)が毎日取得して data/data.json に記録します。
  このページはそのファイルを読み、最新の記録と1つ前の記録の差を「前日比」として表示します。
  ?demo を付けて開くとダミー値で表示します。
-->
<style>
  :root {
    color-scheme: light;
    --surface-0: #f4f4f2;
    --surface-1: #fcfcfb;
    --border: #e2e1dc;
    --grid: #ecebe7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #7a7974;
    --series-1: #2a78d6;
    --series-1-hover: #4a8fe0;
    --accent-soft: #e8f0fb;
    --critical: #c8302f;
    --card-bg: #fffefc;
    --card-line: #f7cfb0;
    --title-ink: #6b6966;
    --value-ink: #8f8d89;
    --row-hover: #fff3ea;
    --radio-panel: #E7E6EA;
    --radio-on-bg: #FBEBC8;
    --radio-ring: #9B9A9F;
    --radio-dot: #EE7F2E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-0: #121211;
      --surface-1: #1a1a19;
      --border: #2e2e2c;
      --grid: #262624;
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted: #8e8d86;
      --series-1: #3987e5;
      --series-1-hover: #5a9bea;
      --accent-soft: #1d2a3b;
      --critical: #e66767;
      --card-bg: #1c1b1a;
      --card-line: #5a4232;
      --title-ink: #d6d4cf;
      --value-ink: #b4b2ac;
      --row-hover: #2a2420;
      --radio-panel: #26262A;
      --radio-on-bg: #43351F;
      --radio-ring: #8E8D93;
      --radio-dot: #F08A3E;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "IBM Plex Sans JP", system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    background: var(--surface-0);
    color: var(--text-primary);
    line-height: 1.5;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .01em; }
  .updated { margin-left: auto; font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sub { color: var(--text-secondary); font-size: 13px; margin-top: 4px; }
  h2 { font-size: 16px; margin: 0 0 4px; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
  .note { color: var(--text-muted); font-size: 12px; }
  button, select, input[type="text"], input[type="password"] {
    font: inherit; font-size: 14px; color: var(--text-primary);
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--text-muted); }
  button.primary { background: var(--series-1); border-color: var(--series-1); color: #fff; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 6px 12px; background: transparent; color: var(--text-secondary); }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--text-primary); font-weight: 600; }

  /* KPI */
  .kpis { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 12px; margin-bottom: 16px; }
  #kpiTotal { text-align: right; }
  #kpiTop, #kpiTopTitle, #kpiTopDetail { text-align: right; }
  .kpi-top { display: grid; grid-template-columns: 176px auto minmax(0, 1fr); gap: 12px; align-items: center; text-decoration: none; color: inherit; }
  .crown { width: 34px; height: 26px; align-self: center; filter: drop-shadow(0 1px 1px rgba(0,0,0,.15)); }
  .kpi-top:hover { border-color: var(--text-muted); }
  .kpi-thumb .thumb { width: 100%; }
  .kpi .top-title { font-weight: 700; font-size: 15px; line-height: 1.35; margin-top: 2px; }
  @media (max-width: 640px) {
    .kpis { grid-template-columns: minmax(0, 1fr); }
    .kpi-top { grid-template-columns: 112px auto minmax(0, 1fr); gap: 8px; }
    .crown { width: 28px; height: 21px; }
  }
  .kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .kpi .label { font-size: 12px; color: var(--text-secondary); }
  .kpi .value { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .kpi .detail { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Idol bars (ゲーム風) */
  .idol-card {
    padding: 4px 0 8px; margin-bottom: 16px;
  }
  .idol-card h2 { text-align: center; font-size: 22px; color: var(--title-ink); margin: 0; font-weight: 700; letter-spacing: .04em; }
  .idol-sub { text-align: center; font-size: 12px; color: var(--text-muted); margin: 2px 0 18px; }
  .ibars { display: grid; gap: 6px; }
  .irow {
    display: grid; grid-template-columns: 1fr; align-items: center;
    width: 100%; padding: 6px 8px; border: 0; border-radius: 12px; background: transparent;
    text-align: left; cursor: pointer; color: inherit; font: inherit;
  }
  .irow:hover, .irow:focus-visible { background: var(--row-hover); outline: none; }
  .irow:active { transform: scale(.99); }
  .ibar-col { min-width: 0; }
  .iname { font-size: 14px; font-weight: 700; color: var(--text-secondary); margin-bottom: 2px; }
  .itrack { height: 26px; }
  .ifill { height: 100%; width: 0; border-radius: 2px; transition: width .7s cubic-bezier(.25, 1, .5, 1); }
  .ival { text-align: right; font-size: 20px; font-weight: 700; color: var(--value-ink); margin-top: 2px; font-variant-numeric: tabular-nums; line-height: 1.3; }

  /* 期間・表示の切り替え(ラジオボタン) */
  .switches { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin: 0 0 12px; }
  .radio-group { margin: 0; padding: 8px; border: 0; border-radius: 12px; background: var(--radio-panel); min-width: 0; }
  /* 見出しは画面には出さず、読み上げ用にだけ残す */
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  /* ボタンの幅は文字数に合わせ、残りの幅を均等に足す(「曲」は狭く、「アイドル」は広く) */
  .radios { display: flex; gap: 6px; }
  .radios .radio { flex: 1 1 auto; }
  .radio { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 6px 6px; border-radius: 10px; background: var(--surface-1); cursor: pointer; font-size: 15px; font-weight: 500; color: var(--text-primary); -webkit-tap-highlight-color: transparent; white-space: nowrap; }
  .radio:has(input:checked) { background: var(--radio-on-bg); }
  .radio input { appearance: none; -webkit-appearance: none; flex: none; width: 18px; height: 18px; margin: 0; border-radius: 50%; border: 2px solid var(--radio-ring); background: var(--surface-1); }
  .radio input:checked { background: radial-gradient(circle, var(--radio-dot) 0 4.5px, var(--surface-1) 5px); }
  .radio input:focus { outline: none; }
  .radio input:focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 2px; }
  /* 「MVだけで集計」のオン/オフ */
  .mv-only { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 12px; padding: 8px 12px; min-height: 48px; border-radius: 12px; background: var(--radio-panel); font-size: 15px; font-weight: 500; color: var(--text-primary); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .mv-only input { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 46px; height: 28px; margin: 0; border-radius: 999px; background: var(--radio-ring); cursor: pointer; transition: background .2s; }
  .mv-only input::before { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .2s; }
  .mv-only input:checked { background: var(--radio-dot); }
  .mv-only input:checked::before { transform: translateX(18px); }
  .mv-only input:focus { outline: none; }
  .mv-only input:focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .mv-only input, .mv-only input::before { transition: none; } }
  .ibars .song-row { padding: 8px 6px; }
  .today-note { text-align: center; color: var(--text-muted); font-size: 14px; padding: 24px 0; }
  .rank { display: inline-block; margin-left: 6px; vertical-align: -3px; }
  .rank svg { width: 22px; height: 17px; display: block; }
  /* PC(900px以上)では左に累計、右にデイリーの表を並べる。「今日/累計」の切り替えはPCでは隠す */
  .boards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .board-head, .board-today { display: none; }
  @media (min-width: 900px) {
    .boards { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
    .board-head, .board-today { display: block; }
    .board-head h2 { margin: 4px 0 12px; }
    .period-group { display: none; }
    .switches { grid-template-columns: minmax(0, 1fr); }
  }

  /* Detail dialog */
  dialog#detail {
    width: min(560px, calc(100% - 24px)); max-height: min(80vh, 760px); padding: 0; border: 2px solid var(--card-line);
    border-radius: 18px; background: var(--card-bg); color: var(--text-primary); overflow: hidden;
  }
  dialog#detail[open] { display: flex; flex-direction: column; }
  dialog#detail::backdrop { background: rgba(0,0,0,.45); }
  /* 開くときにフェードで表示する */
  dialog#detail[open] { animation: detail-in .22s ease-out; }
  dialog#detail[open]::backdrop { animation: backdrop-in .22s ease-out; }
  @keyframes detail-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes backdrop-in { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { dialog#detail[open], dialog#detail[open]::backdrop { animation: none; } }
  .d-head {
    display: grid; grid-template-columns: minmax(0, 1fr) auto auto; column-gap: 12px; align-items: center;
    padding: 16px 16px 12px; border-bottom: 1px solid var(--grid);
  }
  .d-name { grid-column: 1; grid-row: 1; font-size: 18px; font-weight: 700; line-height: 1.4; }
  .d-sub { grid-column: 1; grid-row: 2; font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d-total { grid-column: 2; grid-row: 1; text-align: right; font-size: 18px; font-weight: 700; line-height: 1.4; font-variant-numeric: tabular-nums; }
  .d-diff { grid-column: 2; grid-row: 2; text-align: right; }
  .d-close { grid-column: 3; grid-row: 1 / span 2; }
  /* 「戻る」があるとき(アイドルの画面から曲を開いたとき)は左端に1列足す */
  .d-back { display: none; }
  .d-head.with-back { grid-template-columns: auto minmax(0, 1fr) auto auto; }
  .d-head.with-back .d-back { display: block; grid-column: 1; grid-row: 1 / span 2; }
  .d-head.with-back .d-name, .d-head.with-back .d-sub { grid-column: 2; }
  .d-head.with-back .d-total, .d-head.with-back .d-diff { grid-column: 3; }
  .d-head.with-back .d-close { grid-column: 4; }
  .d-back { width: 36px; height: 36px; border-radius: 50%; font-size: 20px; line-height: 1; padding: 0; -webkit-tap-highlight-color: transparent; }
  .d-back:focus { outline: none; }
  .d-back:focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 2px; }
  .d-close { -webkit-tap-highlight-color: transparent; }
  .d-close:focus { outline: none; }
  .d-close:focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 2px; }
  dialog#detail:focus { outline: none; }
  .d-close { width: 36px; height: 36px; border-radius: 50%; font-size: 20px; line-height: 1; padding: 0; }
  .d-body { overflow-y: auto; padding: 8px 12px 16px; }
  .d-section { font-size: 12px; font-weight: 700; color: var(--text-secondary); margin: 12px 4px 6px; }
  .song-row {
    display: grid; grid-template-columns: 136px 1fr; gap: 12px; align-items: center; padding: 8px 4px;
    border-radius: 10px; text-decoration: none; color: inherit;
  }
  .song-row:hover { background: var(--row-hover); }
  button.song-row {
    width: 100%; border: 0; background: transparent; font: inherit; color: inherit; text-align: left;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  button.song-row:hover { background: var(--row-hover); }
  button.song-row:focus { outline: none; }
  button.song-row:focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 2px; }
  /* 動画一覧の種類ラベル(MV/音源/インスト) */
  .v-head { display: flex; align-items: center; gap: 8px; }
  .v-head .s-meta { margin-top: 0; margin-left: auto; font-weight: 400; }
  .v-type { display: inline-block; font-size: 12px; font-weight: 700; line-height: 1; padding: 4px 8px; border-radius: 999px; background: var(--grid); color: var(--text-primary); }
  .song-row .thumb { width: 136px; }
  .s-title { font-weight: 700; font-size: 14px; line-height: 1.35; }
  .s-meta { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .s-bar { height: 8px; width: 0; border-radius: 2px; margin-top: 6px; transition: width .7s cubic-bezier(.25, 1, .5, 1); }
  @media (prefers-reduced-motion: reduce) { .ifill, .s-bar { transition: none; } }
  .s-views { font-size: 16px; font-weight: 700; color: var(--value-ink); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .diff { font-size: 13px; font-weight: 500; color: var(--text-secondary); font-variant-numeric: tabular-nums; line-height: 1.4; }
  .diff .dl { color: var(--text-muted); font-weight: 400; margin-right: .4em; }
  .diff.new { color: var(--series-1); font-weight: 700; }
  .kpi .diff, .ival + .diff { text-align: right; }
  .s-views .diff { display: inline; margin-left: 8px; }
  .unit { font-size: .6em; font-weight: 400; margin-left: .12em; letter-spacing: .02em; }
  .d-empty { color: var(--text-muted); font-size: 13px; padding: 8px 4px; }

  .thumb { width: 96px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; display: block; background: var(--grid); }

  /* Status */
  .status { padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-1); margin-bottom: 16px; font-size: 14px; }
  .status.error { border-color: var(--critical); }
  .status.error strong { color: var(--critical); }
  .hidden { display: none !important; }
  /* 曲の検索(切替の下に常に表示) */
  .search { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
  .search .search-box { flex: 1; min-width: 0; }
  .settings-btn {
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    width: 44px; height: 44px; padding: 0; border: 1px solid var(--border); border-radius: 12px;
    background: var(--surface-1); color: var(--text-secondary); cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  /* 設定:検索欄の下に、少し下へずれながら浮かぶカードとして出す。開いた分だけランキングを下げる
     (高さは grid の 0fr → 1fr で滑らかに変える) */
  .settings { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .2s ease; }
  .settings.open { grid-template-rows: 1fr; }
  /* 影が切れないように左右と下に余白を取る(閉じているときは余白も 0) */
  .settings-clip { min-height: 0; overflow: hidden; margin: 0 -14px; padding: 0 14px; transition: padding .2s ease; }
  .settings.open .settings-clip { padding: 0 14px 20px; }
  .settings-card {
    padding: 12px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface-1);
    box-shadow: 0 6px 12px rgba(0, 0, 0, .10), 0 1px 4px rgba(0, 0, 0, .06);
    opacity: 0; visibility: hidden; transform: translateY(-8px);
    transition: opacity .2s ease, transform .2s ease, visibility 0s linear .2s;
  }
  .settings.open .settings-card { opacity: 1; visibility: visible; transform: translateY(0); transition: opacity .2s ease, transform .2s ease, visibility 0s; }
  .settings .mv-only { margin-bottom: 0; }
  @media (prefers-reduced-motion: reduce) {
    .settings, .settings-clip, .settings-card, .settings.open .settings-card { transition: none; transform: none; }
  }
  .settings-btn svg { width: 20px; height: 20px; display: block; }
  .settings-btn[aria-expanded="true"] { background: var(--radio-on-bg); color: var(--text-primary); }
  .settings-btn:focus { outline: none; }
  .settings-btn:focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 2px; }
  .search-close {
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    width: 36px; height: 36px; padding: 0; border-radius: 50%; color: var(--text-secondary);
    -webkit-tap-highlight-color: transparent;
  }
  .search-close:focus { outline: none; }
  .search-close:focus-visible { outline: 2px solid var(--text-secondary); outline-offset: 2px; }
  .search-box > svg { width: 18px; height: 18px; display: block; flex: none; }
  .search-close { border: 0; background: transparent; font-size: 20px; line-height: 1; }
  .search-box {
    display: flex; align-items: center; gap: 6px; width: 100%; min-height: 44px; padding: 0 2px 0 12px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--surface-1); color: var(--text-muted);
  }
  .search-box:focus-within { border-color: var(--text-muted); }
  .search-box input {
    flex: 1; min-width: 0; height: 40px; padding: 0; border: 0; background: transparent; outline: none;
    font: inherit; font-size: 16px; color: var(--text-primary); -webkit-appearance: none; appearance: none;
  }
  .search-box input::-webkit-search-cancel-button { display: none; }
  .search-empty { color: var(--text-muted); font-size: 14px; text-align: center; padding: 24px 0; }
  .foot { margin-top: 24px; text-align: center; }

  @media (max-width: 640px) {
    .irow { padding: 5px 4px; }
    .ival { font-size: 18px; }
    .song-row { grid-template-columns: 112px 1fr; gap: 10px; }
    .song-row .thumb { width: 112px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>学マス楽曲レポート</h1>
    <div class="updated" id="updated"></div>
  </header>

  <div id="status" class="status hidden" role="status"></div>

  <main id="main" class="hidden">
    <section class="kpis" aria-label="概要">
      <div class="kpi"><div class="label" id="kpiTotalLabel">総再生回数</div><div class="value" id="kpiTotal">–</div><div class="diff" id="kpiTotalDiff"></div></div>
      <a class="kpi kpi-top" id="kpiTopLink" aria-label="最多再生MV" target="_blank" rel="noopener">
        <div class="kpi-thumb" id="kpiTopThumb"></div>
        <svg class="crown" viewBox="0 0 32 24" aria-label="1位" role="img"><path d="M3 8l6.5 5L16 3l6.5 10L29 8l-2.6 12.5H5.6z" fill="#F4BE2C" stroke="#C98F0A" stroke-width="1.6" stroke-linejoin="round"/><rect x="5.4" y="19.2" width="21.2" height="3.4" rx="1.2" fill="#E3A812" stroke="#C98F0A" stroke-width="1.2"/><circle cx="3" cy="7.5" r="2" fill="#F4BE2C" stroke="#C98F0A" stroke-width="1.2"/><circle cx="16" cy="2.8" r="2" fill="#F4BE2C" stroke="#C98F0A" stroke-width="1.2"/><circle cx="29" cy="7.5" r="2" fill="#F4BE2C" stroke="#C98F0A" stroke-width="1.2"/><circle cx="16" cy="14" r="1.6" fill="#fff" opacity=".85"/></svg>
        <div class="kpi-top-info">
          <div class="value" id="kpiTop">–</div>
          <div class="diff" id="kpiTopTotal"></div>
          <div class="top-title" id="kpiTopTitle"></div>
          <div class="detail" id="kpiTopDetail"></div>
        </div>
      </a>
    </section>

    <section class="idol-card" aria-label="アイドルごとのソロ曲再生回数(タップで曲ごとの回数)">
      <div class="search" id="search">
        <div class="search-box" id="searchBox" role="search">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>

// MV・歌入り音源・インストを曲名で1曲にまとめ、再生回数と前日比を合計する
// data/data.json の1曲から、表示に使う曲の情報を作る(mvOnly なら MV だけで集計し、MV がなければ null)
// 曲の動画は MV → 歌入り音源 → インストの順に並んでいて、先頭がサムネイル・リンク・曲名の代表
function buildSong(s, mvOnly) {
  const vids = mvOnly ? s.videos.filter((v) => v.type === "mv") : s.videos;
  if (!vids.length) return null;
  const members = vids.map((v) => ({
    id: v.id, source: v.type === "mv" ? "mv" : "audio", instrumental: v.type === "inst",
    published: v.date, views: v.views, diff: v.diff ?? null, isNew: !!v.isNew,
  }));
  const hasDiff = members.some((m) => m.diff != null);
  return {
    id: members[0].id,
    title: s.title,
    idols: s.idols,
    kind: s.idols.length === 1 ? "solo" : "group",
    singer: s.singer ?? s.idols.join("・"),
    published: members.map((m) => m.published).sort()[0],
    views: members.reduce((n, m) => n + m.views, 0),
    diff: hasDiff ? members.reduce((n, m) => n + (m.diff || 0), 0) : null,
    isNew: members.every((m) => m.isNew),
    members, // 動画一覧(曲をタップしたとき)用
  };
}

// 「MVだけで集計」がオンなら MV だけで曲をまとめる(MVのない曲はランキングから外れる)
// 上の数字・曲・アイドル・動画一覧のすべてがこの集計を使う
function regroup() {
  state.videos = state.songs.map((s) => buildSong(s, state.mvOnly)).filter(Boolean);
}
// 設定はこのブラウザに覚えておく(使えない環境では毎回オフから)

// data/data.json の形(scripts/build-site.mjs が作る):
// { updatedAt, prevDate, songs: [{ title, idols, singer?, videos: [{ id, type, date, views, diff?, isNew? }] }] }
// views は合計回数、diff はその日の回数(取得のときに計算済み)。前日の記録がないときは prevDate が null
function apply(data) {
  state.hasPrev = !!data.prevDate;
  state.prevDate = data.prevDate || null;
  state.updatedAt = data.updatedAt;
  state.songs = data.songs || [];
  // 一覧にないアイドルが歌唱に出てきたら、灰色で追加する

    const t = new Date(state.updatedAt);
    $("updated").textContent = "最終更新 " + t.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });

  renderBars();
}

// 前日比の表示要素を作る(label を付けると「前日比 +1,234」の形)
function diffEl(el, diff, opts = {}) {
  el.textContent = "";
  el.classList.remove("new");
  if (!state.hasPrev || diff == null) return el;
  if (opts.isNew) {
    el.classList.add("new");
    el.textContent = "NEW";
    return el;
  }
  if (opts.label) {
    const l = document.createElement("span"); l.className = "dl"; l.textContent = "前日比";
    el.append(l);
  }
  const sign = diff > 0 ? "+" : diff < 0 ? "−" : "±";
  const num = document.createElement("span");
  el.append(num);
  countUp(num, Math.abs(diff), (n) => sign + fmt.format(n), opts.delay || 0);
  return el;
}
const sumDiff = (list) => list.reduce((s, v) => s + (v.diff || 0), 0);

// ---- アニメーション:数字は0から、棒は幅0から伸ばす ----
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const DURATION = 700;
const ease = (t) => 1 - Math.pow(1 - t, 4); // ease-out(quart)
function countUp(el, target, format = (n) => fmt.format(n), delay = 0) {
  if (REDUCED || !target) { el.textContent = format(target); return; }
  el.textContent = format(0);
  const run = (t0) => {
    const step = (now) => {
      const t = Math.min(1, (now - t0) / DURATION);
      el.textContent = format(Math.round(target * ease(t)));
      if (t < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };
  setTimeout(() => requestAnimationFrame(run), delay);
}
function growBar(el, pct, delay = 0) {
  el.style.width = "0%";
  el.style.transitionDelay = delay + "ms";
  if (REDUCED) { el.style.width = pct + "%"; return; }
  requestAnimationFrame(() => requestAnimationFrame(() => { el.style.width = pct + "%"; }));
}


// 「今日」のときは、総再生回数も最多MVも今日0時からの増加で出す
function renderKpis() {
  const vs = state.videos;
  const today = isToday();
  const noData = today && !state.hasPrev;
  $("kpiTotalLabel").textContent = (today ? "今日の再生回数" : "総再生回数") + (state.mvOnly ? "(MVのみ)" : "");
  const total = vs.reduce((s, v) => s + metric(v), 0);
  if (noData) $("kpiTotal").textContent = "–"; else countUp($("kpiTotal"), total, todayFmt());
  diffEl($("kpiTotalDiff"), today ? null : sumDiff(vs));
  if (showViewsToo()) $("kpiTotalDiff").textContent = fmt.format(vs.reduce((s, v) => s + v.views, 0));
  const top = noData ? null : vs.reduce((a, b) => (metric(b) > (a ? metric(a) : -1) ? b : a), null);
  if (top) countUp($("kpiTop"), metric(top), todayFmt()); else $("kpiTop").textContent = "–";
  $("kpiTopTotal").textContent = top && showViewsToo() ? fmt.format(top.views) : "";
  $("kpiTopTitle").textContent = top ? top.title : "";
  $("kpiTopDetail").textContent = top ? top.singer : "";
  const th = $("kpiTopThumb");
  th.textContent = "";
  if (top) {
    th.append(thumbEl(top));
    $("kpiTopLink").href = "https://www.youtube.com/watch?v=" + encodeURIComponent(top.id);
  }
}

function idolStats() {
  return IDOLS.map((idol) => {
    const name = idol.name;
    const songs = state.videos.filter((v) => v.kind === "solo" && v.idols[0] === name);
    const total = songs.reduce((s, v) => s + v.views, 0);
    const top = songs.reduce((a, b) => (b.views > (a?.views ?? -1) ? b : a), null);
    return { idol, name, count: songs.length, total, diff: sumDiff(songs), avg: songs.length ? total / songs.length : 0, max: top?.views || 0, top };
  });
}

function thumbUrl(v) {
  return v.thumb || "https://i.ytimg.com/vi/" + encodeURIComponent(v.id) + "/mqdefault.jpg";
}
// ランキングのサムネイルは、上から順に読み込む(同時に THUMB_PARALLEL 枚まで)。
// 一覧を描き直したら、まだ始めていない分は捨てて新しい一覧の頭からやり直す
const THUMB_PARALLEL = 3;
const thumbQueue = { list: [], active: 0, gen: 0 };
function resetThumbQueue() { thumbQueue.list = []; thumbQueue.active = 0; thumbQueue.gen++; }
function pumpThumbs() {
  while (thumbQueue.active < THUMB_PARALLEL && thumbQueue.list.length) {
    const { img, url, gen } = thumbQueue.list.shift();
    thumbQueue.active++;
    const done = () => { if (gen === thumbQueue.gen) thumbQueue.active--; pumpThumbs(); };
    img.addEventListener("load", done, { once: true });
    img.addEventListener("error", done, { once: true });
    img.src = url;
  }
}
// opts.queue:順番待ちで読み込む(ランキング用)。なければすぐ読み込む(ポップアップや上のカード)
function thumbEl(v, opts = {}) {
  const img = document.createElement("img");
  img.className = "thumb"; img.alt = "";
  if (opts.queue) { thumbQueue.list.push({ img, url: thumbUrl(v), gen: thumbQueue.gen }); queueMicrotask(pumpThumbs); }
  else { img.loading = "lazy"; img.src = thumbUrl(v); }
  img.addEventListener("error", () => {
    const ph = document.createElement("div"); ph.className = "thumb";
    img.replaceWith(ph);
  }, { once: true });
  return img;
}
// 「累計」タブは累計の再生回数、「今日」タブは今日0時からの増加で集計する
// PC(900px以上)では2つの表を並べる。上の数字は累計で出す
// viewOverride:表を描くときや、表から開いたポップアップでは、その表の期間を使う
const WIDE = matchMedia("(min-width: 900px)");
const isWide = () => WIDE.matches;
let viewOverride = null;
const currentView = () => viewOverride || (isWide() ? "total" : state.view);
const isToday = () => currentView() === "today";
function withView(view, fn) {
  const was = viewOverride;
  viewOverride = view;
  try { return fn(); } finally { viewOverride = was; }
}
// 表の行をタップしたら、その表の期間のままポップアップを開く(閉じると元に戻る)
const openIn = (view, fn) => () => { viewOverride = view; fn(); };
const metric = (v) => (isToday() ? (v.diff ?? 0) : v.views);
// スマホの「今日」表示では、今日の回数に総再生回数(累計)の数字だけを併記する(PCの2つの表では出さない)
const showViewsToo = () => isToday() && !isWide();
// 併記するときは、今日の回数に「+」を付けて総再生回数と見分けやすくする
const todayFmt = () => (showViewsToo() ? (n) => "+" + fmt.format(n) : undefined);
const viewsLabel = (n) => (showViewsToo() ? `、総再生回数 ${fmt.format(n)}回` : "");

// 1〜3位の王冠(金・銀・銅)
const CROWN_COLORS = [
  { fill: "#F4BE2C", band: "#E3A812", line: "#C98F0A" },
  { fill: "#D5D9DE", band: "#BCC2C9", line: "#8E959E" },
  { fill: "#DE9A62", band: "#C47A43", line: "#9A5A2B" },
];
function crownEl(rank) {
  const span = document.createElement("span");
  span.className = "rank";
  const c = CROWN_COLORS.at(rank - 1);
  if (c) {
    span.innerHTML = `<svg viewBox="0 0 32 24" role="img" aria-label="${rank}位"><path d="M3 8l6.5 5L16 3l6.5 10L29 8l-2.6 12.5H5.6z" fill="${c.fill}" stroke="${c.line}" stroke-width="1.6" stroke-linejoin="round"/><rect x="5.4" y="19.2" width="21.2" height="3.4" rx="1.2" fill="${c.band}" stroke="${c.line}" stroke-width="1.2"/><circle cx="3" cy="7.5" r="2" fill="${c.fill}" stroke="${c.line}" stroke-width="1.2"/><circle cx="16" cy="2.8" r="2" fill="${c.fill}" stroke="${c.line}" stroke-width="1.2"/><circle cx="29" cy="7.5" r="2" fill="${c.fill}" stroke="${c.line}" stroke-width="1.2"/></svg>`;
  }
  return span;
}

// ---- 検索:曲名・歌唱アイドル名(漢字・ひらがな・ローマ字)・曲名の読みで絞り込む ----
// 比較用の文字列:全角半角・大文字小文字・カタカナとひらがなの違いと、空白や記号を無視する
function searchNorm(t) {
  return String(t).normalize("NFKC").toLowerCase()
    .replace(/[\u30a1-\u30f6]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[\s・、。,.!?！？「」『』()（）'"’”“~〜\-‐―↑]/g, "");
}
const searchTokens = () => state.query.split(/[\s　]+/).map(searchNorm).filter(Boolean);
const searchCache = new WeakMap();
// contains:語を含めば当てはまる(曲名・読み・歌唱の表示・アイドル名の漢字)
// prefix:語で始まれば当てはまる(アイドル名のひらがな・ローマ字。「さき」で姫崎莉波まで出ないように、姓・名・姓名・名姓の頭で比べる)
// アイドル名のひらがな・ローマ字(姓・名・姓名・名姓)
function idolNameParts(name) {
  const kana = (IDOLS.find((i) => i.name === name)?.kana || "").split(" ").filter(Boolean);
  const [given = "", family = ""] = ROMAJI[name] || [];
  return [...kana, kana.join(""), [...kana].reverse().join(""), given, family, family + given, given + family];
}
function searchFields(v) {
  if (searchCache.has(v)) return searchCache.get(v);
  // ユニット名だけの曲(Star-mine・雨上がりのアイリス)は、メンバーの名前でも探せるようにする
  const singers = v.idols.length ? v.idols : (UNIT_MEMBERS[v.singer] || []);
  const contains = [v.title, ...[].concat(SONG_READINGS[v.title] || []), v.singer, ...singers];
  const prefix = singers.flatMap(idolNameParts);
  const fields = { contains: contains.map(searchNorm).filter(Boolean), prefix: prefix.map(searchNorm).filter(Boolean) };
  searchCache.set(v, fields);
  return fields;
}
const fieldsMatch = (f, tokens) => tokens.every((t) => f.contains.some((x) => x.includes(t)) || f.prefix.some((x) => x.startsWith(t)));
// 曲:スペース区切りの語がすべて、曲名・読み・歌唱アイドル名のどれかに当てはまる曲を残す
function matchesSearch(v) {
  const tokens = searchTokens();
  return !tokens.length || fieldsMatch(searchFields(v), tokens);
}
// 歌唱の表示がユニット名だけの曲のメンバー(検索用。曲表示ではアイドル名で、アイドル表示では曲名で当てはめる)
const UNIT_MEMBERS = {
  "Re;IRIS": ["花海咲季", "月村手毬", "藤田ことね"],
  "Begrazia": ["花海佑芽", "秦谷美鈴", "十王星南"],
};
// その曲を歌っているアイドル。「初星学園」名義の全体曲は全員とみなす
function singersOf(v) {
  if (v.idols.length) return v.idols;
  if (v.singer === "初星学園") return IDOLS.map((i) => i.name);
  return UNIT_MEMBERS[v.singer] || [];
}
// 曲名と読みだけで比べる(アイドル表示で曲名を検索するとき用)
const songTitleMatches = (v, t) => [v.title, ...[].concat(SONG_READINGS[v.title] || [])].some((x) => searchNorm(x).includes(t));
// アイドル:名前(漢字・ひらがな・ローマ字)に当てはまるか、当てはまる曲を歌っているアイドルを残す
// スペース区切りなら、すべての語に当てはまるアイドル(曲タブと同じ AND)。並びと回数はいつもどおり(ソロ曲の合計)
function idolMatchesSearch(name) {
  const tokens = searchTokens();
  if (!tokens.length) return true;
  const f = { contains: [searchNorm(name)], prefix: idolNameParts(name).map(searchNorm).filter(Boolean) };
  const songs = state.videos.filter((v) => singersOf(v).includes(name));
  return tokens.every((t) => fieldsMatch(f, [t]) || songs.some((v) => songTitleMatches(v, t)));
}

// 曲ごとのランキング(ソロ・ユニット・全体曲のすべてのMV)
const GROUP_COLOR = "#A3A3A3";
const songColor = (v) => (v.kind === "solo" ? (IDOLS.find((i) => i.name === v.idols[0])?.color || GROUP_COLOR) : GROUP_COLOR);
function renderSongs(box) {
  const today = isToday();
  // 曲は全部並べる(サムネイルは上から順に読み込む)。検索中は順位(王冠)を出さない
  const searching = !!searchTokens().length;
  const list = [...state.videos].filter(matchesSearch).sort((a, b) => metric(b) - metric(a));
  if (searching && !list.length) {
    const e = document.createElement("div"); e.className = "search-empty"; e.textContent = "見つかりませんでした";
    box.append(e);
  }
  const levels = [...new Set(list.map(metric))];
  const maxVal = Math.max(1, ...list.map(metric));
  list.forEach((v, idx) => {
    const value = metric(v);
    const rank = searching ? 0 : levels.indexOf(value) + 1;
    const ranked = value > 0 && rank >= 1 && rank <= 3;
    const row = songRow(v, songColor(v), maxVal, idx, { rank: ranked ? rank : 0, showSinger: true, queueThumb: true });
    row.setAttribute("aria-label", `${ranked ? rank + "位 " : ""}${v.title}(${v.singer})${today ? " 今日の再生回数 " : " 再生回数 "}${fmt.format(value)}回${viewsLabel(v.views)}。タップで動画の一覧`);
    row.addEventListener("click", openIn(currentView(), () => openSong(v)));
    box.append(row);
  });
}

function renderBars() {
  resetThumbQueue();
  if (isWide()) {
    withView("total", () => renderBoard($("bars")));
    withView("today", () => renderBoard($("barsToday")));
  } else withView(state.view, () => renderBoard($("bars")));
}

function renderBoard(box) {
  box.textContent = "";
  const today = isToday();
  if (today && !state.hasPrev) {
    const e = document.createElement("div"); e.className = "today-note"; e.textContent = "今日のランキングは明日から表示されます。";
    box.append(e);
    return;
  }
  if (state.unit === "song") { renderSongs(box); return; }
  // 検索中は名前に当てはまるアイドルだけを並べ、順位(王冠)は出さない
  const searching = !!searchTokens().length;
  const stats = idolStats().map((s) => ({ ...s, value: today ? s.diff : s.total }))
    .filter((s) => s.count)
    .sort((a, b) => b.value - a.value);
  if (!today) stats.push(...idolStats().filter((s) => !s.count).map((s) => ({ ...s, value: 0 })));
  if (searching) {
    const kept = stats.filter((s) => idolMatchesSearch(s.name));
    stats.length = 0; stats.push(...kept);
    if (!stats.length) {
      const e = document.createElement("div"); e.className = "search-empty"; e.textContent = "見つかりませんでした";
      box.append(e);
    }
  }
  const maxVal = Math.max(1, ...stats.map((s) => s.value));
  // 同じ値は同じ順位(1, 2, 2, 3 …)
  const levels = [...new Set(stats.map((s) => s.value))];
  stats.forEach((s, idx) => {
    const row = document.createElement("button");
    row.type = "button";
    row.className = "irow";
    const rank = searching ? 99 : levels.indexOf(s.value) + 1;
    row.setAttribute("aria-label", today
      ? `${rank <= 3 && s.value > 0 ? rank + "位 " : ""}${s.name} 今日の再生回数 ${fmt.format(s.value)}回${viewsLabel(s.total)}。タップで曲ごとの回数`
      : `${s.name} ソロ曲合計 ${fmt.format(s.total)}回` + (state.hasPrev && s.count ? `、前日比 ${s.diff >= 0 ? "+" : "−"}${fmt.format(Math.abs(s.diff))}` : "") + "。タップで曲ごとの回数");

    const col = document.createElement("div");
    col.className = "ibar-col";
    const name = document.createElement("div");
    name.className = "iname";
    name.append(document.createTextNode(s.name));
    if (today && s.value > 0 && rank <= 3) name.append(crownEl(rank));
    const track = document.createElement("div");
    track.className = "itrack";
    if (s.value > 0) {
      const fill = document.createElement("div");
      fill.className = "ifill";
      fill.style.background = s.idol.color;
      growBar(fill, (s.value / maxVal) * 100, idx * 40);
      track.append(fill);
    }
    const val = document.createElement("div");
    val.className = "ival";
    if (s.count) countUp(val, s.value, todayFmt(), idx * 40); else val.textContent = "-";
    const dv = document.createElement("div");
    dv.className = "diff";
    if (s.count && !today) diffEl(dv, s.diff, { delay: idx * 40 });
    if (s.count && showViewsToo()) dv.textContent = fmt.format(s.total);
    col.append(name, track, val, dv);
    row.append(col);
    row.addEventListener("click", openIn(currentView(), () => openDetail(s.idol)));
    box.append(row);
  });
}

// 公開日(YYYY-MM-DD)を「2024/7/31」の形にする
const fmtDate = (d) => (d ? d.slice(0, 10).split("-").map(Number).join("/") : "");
const youtubeUrl = (id) => "https://www.youtube.com/watch?v=" + encodeURIComponent(id);

// 曲(または動画)の行。opts.href があれば YouTube へのリンク、なければタップ用のボタン
// opts.label があれば曲名の代わりに種類ラベル(動画一覧用)
function songRow(v, color, maxViews, idx = 0, opts = {}) {
  const a = document.createElement(opts.href ? "a" : "button");
  a.className = "song-row";
  if (opts.href) { a.href = opts.href; a.target = "_blank"; a.rel = "noopener"; } else a.type = "button";
  const info = document.createElement("div");
  const t = document.createElement("div"); t.className = "s-title";
  if (opts.label) {
    // 動画一覧では、種類ラベルの右隣に公開日を出す
    t.classList.add("v-head");
    const l = document.createElement("span"); l.className = "v-type"; l.textContent = opts.label;
    const dt = document.createElement("span"); dt.className = "s-meta"; dt.textContent = fmtDate(v.published);
    t.append(l, dt);
  } else t.textContent = v.title;
  if (opts.rank) t.append(crownEl(opts.rank));
  const m = document.createElement("div"); m.className = "s-meta";
  m.textContent = fmtDate(v.published) + (v.kind === "group" || opts.showSinger ? " · " + v.singer : "");
  const bar = document.createElement("div"); bar.className = "s-bar";
  bar.style.background = color; growBar(bar, Math.max(1, (metric(v) / maxViews) * 100), idx * 40);
  const n = document.createElement("div"); n.className = "s-views";
  const nn = document.createElement("span"); n.append(nn); countUp(nn, metric(v), todayFmt(), idx * 40);
  const nd = document.createElement("span"); nd.className = "diff"; diffEl(nd, isToday() && !v.isNew ? null : v.diff, { isNew: v.isNew, delay: idx * 40 });
  n.append(nd);
  if (showViewsToo()) {
    // 新曲は「NEW」の右に並べる
    const nt = nd.textContent ? document.createElement("span") : nd;
    nt.className = "diff"; nt.textContent = fmt.format(v.views);
    if (nt !== nd) n.append(nt);
  }
  info.append(t);
  if (!opts.label) info.append(m);
  info.append(bar, n);
  a.append(thumbEl(v, { queue: !!opts.queueThumb }), info);
  return a;
}

function openDetail(idol) {
  const solo = state.videos.filter((v) => v.kind === "solo" && v.idols[0] === idol.name).sort((a, b) => metric(b) - metric(a));
  const group = state.videos.filter((v) => v.kind === "group" && v.idols.includes(idol.name)).sort((a, b) => metric(b) - metric(a));
  const total = solo.reduce((s, v) => s + metric(v), 0);
  const maxViews = Math.max(1, ...solo.map(metric), ...group.map(metric));

  setDetailHead({ name: idol.name, color: idol.color, total: solo.length ? total : null, diff: solo.length && !isToday() ? sumDiff(solo) : null, views: solo.length ? solo.reduce((s, v) => s + v.views, 0) : null });

  const body = $("detailBody");
  body.textContent = "";
  let rowIdx = 0;
  const sec = (label, list) => {
    const h = document.createElement("div"); h.className = "d-section"; h.textContent = label;
    body.append(h);
    if (!list.length) {
      const e = document.createElement("div"); e.className = "d-empty"; e.textContent = "該当する曲はありません";
      body.append(e);
    }
    list.forEach((v) => {
      const row = songRow(v, idol.color, maxViews, rowIdx++);
      row.setAttribute("aria-label", `${v.title}(${v.singer})${isToday() ? " 今日の再生回数 " : " 再生回数 "}${fmt.format(metric(v))}回${viewsLabel(v.views)}。タップで動画の一覧`);
      row.addEventListener("click", () => openSong(v, { back: () => openDetail(idol) }));
      body.append(row);
    });
  };
  sec("ソロ曲", solo);
  if (group.length) sec("参加しているユニット・全体曲", group);
  showDetail();
}

// 曲をタップしたとき:その曲の動画(MV・音源・インスト)の一覧
const TYPE_LABELS = { mv: "MV", vocal: "音源", inst: "インスト" };
const typeOf = (m) => (m.source === "audio" ? (m.instrumental ? "inst" : "vocal") : "mv");
function openSong(song, opts = {}) {
  const color = songColor(song);
  setDetailHead({
    name: song.title, sub: song.singer, color, back: opts.back,
    total: metric(song), diff: isToday() ? null : song.diff, isNew: song.isNew, views: song.views,
  });
  const body = $("detailBody");
  body.textContent = "";
  // 並びは MV → 音源 → インスト(data.json で並んでいる順)
  const maxViews = Math.max(1, ...song.members.map(metric));
  song.members.forEach((m, i) => {
    const label = TYPE_LABELS[typeOf(m)];
    const row = songRow(m, color, maxViews, i, { href: youtubeUrl(m.id), label });
    row.setAttribute("aria-label", `${label} ${song.title}${isToday() ? " 今日の再生回数 " : " 再生回数 "}${fmt.format(metric(m))}回${viewsLabel(m.views)}。YouTubeで開く`);
    body.append(row);
  });
  showDetail();
}

// ポップアップの上の部分。total が null のときは「-」、back を渡すと「戻る」ボタンを出す
// views:スマホの「今日」表示で併記する総再生回数
function setDetailHead({ name, sub = "", color, total, diff, isNew = false, views = null, back = null }) {
  $("detailName").textContent = name;
  $("detailSub").textContent = sub;
  $("detail").style.borderColor = color;
  if (total != null) countUp($("detailTotal"), total, todayFmt()); else $("detailTotal").textContent = "-";
  diffEl($("detailDiff"), diff, { isNew });
  if (views != null && showViewsToo()) $("detailDiff").textContent = fmt.format(views);
  $("detailHead").classList.toggle("with-back", !!back);
  detailBack = back;
}
let detailBack = null;

function showDetail() {
  const dlg = $("detail");
  if (!dlg.open) {
    if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
  }
  // 開いた直後に閉じるボタンへフォーカスが当たり、モバイルで青い枠が出るのを防ぐ
  dlg.focus({ preventScroll: true });
  $("detailBody").scrollTop = 0;
}

// ---- イベント ----
document.querySelectorAll('.switches input[type="radio"]').forEach((r) => r.addEventListener("change", () => {
  if (!r.checked) return;
  state[r.name] = r.value;
  if (r.name === "unit") updateSearchPlaceholder();
  if (r.name === "view") renderKpis();
  renderBars();
}));
// フィルタボタン:検索欄の下の設定を開け閉めする(Esc でも閉じる)
function setSettingsOpen(open) {
  $("settingsBtn").setAttribute("aria-expanded", String(open));
  $("settingsPanel").classList.toggle("open", open);
}
const settingsOpen = () => $("settingsBtn").getAttribute("aria-expanded") === "true";
$("settingsBtn").addEventListener("click", () => setSettingsOpen(!settingsOpen()));
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && settingsOpen()) { setSettingsOpen(false); $("settingsBtn").focus({ preventScroll: true }); }
});

// MVだけで集計
state.mvOnly = loadMvOnly();
$("mvOnly").checked = state.mvOnly;
$("mvOnly").addEventListener("change", (e) => {
  state.mvOnly = e.target.checked;
  saveMvOnly(state.mvOnly);
  regroup();
  renderKpis();
  renderBars();
});

// 検索:入力欄でエンターを押したときに、今のタブ(曲/アイドル)の一覧へ反映する
// タブを切り替えても検索語はそのまま、切り替えた先の一覧にも効く
function applySearch() {
  state.query = $("searchInput").value;
  renderBars();
}
function updateSearchPlaceholder() {
  const t = "曲名・アイドル名";
  $("searchInput").placeholder = t;
  $("searchInput").setAttribute("aria-label", t + "で検索");
}
// ×:検索語を消して、すぐ一覧を元に戻す
function clearSearch(render = true) {
  $("searchInput").value = "";
  $("searchClose").classList.add("hidden");
  const was = state.query;
  state.query = "";
  if (render && was) renderBars();
}
$("searchClose").addEventListener("click", () => { clearSearch(); $("searchInput").focus({ preventScroll: true }); });
$("searchInput").addEventListener("input", (e) => $("searchClose").classList.toggle("hidden", !e.target.value));
$("searchInput").addEventListener("keydown", (e) => {
  // 日本語入力の変換を確定するエンターでは検索しない
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key === "Enter") {
    e.preventDefault();
    applySearch();
    e.target.blur(); // スマホではキーボードを閉じて結果を見やすくする
  }
  if (e.key === "Escape") clearSearch();
});
const dlg = $("detail");
$("detailClose").addEventListener("click", () => dlg.close());
$("detailBack").addEventListener("click", () => { if (detailBack) detailBack(); });
dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
dlg.addEventListener("close", () => { viewOverride = null; });
// 画面の幅が900pxをまたいだら描き直す(1つの表 ⇄ 2つの表)
WIDE.addEventListener("change", () => {
  if (!state.videos.length) return;
  withView(null, renderKpis);
  renderBars();
});
load();
</script>
