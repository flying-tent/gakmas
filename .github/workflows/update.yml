name: 再生回数を記録して公開

on:
  schedule:
    # 毎時7分ごろに実行。混雑時は遅れることがある
    - cron: "7 * * * *"
  workflow_dispatch: # Actions画面から手動でも実行できる
    inputs:
      dry_run:
        description: "お試し実行(記録も公開もせず、取得結果をファイルとして残すだけ)"
        type: boolean
        default: false
  push:
    branches: [main] # サイトのファイルを更新したときは公開だけ行う

# 権限は必要なジョブにだけ渡す（最小権限）
permissions: {}

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  # 1. 再生回数を記録して、公開するファイルをアップロードする
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 記録をコミットして push するため
      pages: read
    steps:
      # 起動時点ではなく、その時の最新の main を取り出す
      # (続けて起動されたとき、前の実行の記録コミットの上に積むため)
      # お試し実行のときは、起動したブランチのコードで動かす
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.dry_run && github.ref_name || 'main' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: 再生回数を取得
        if: github.event_name != 'push'
        run: node scripts/fetch.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}

      # 前日のランキングを X に投稿する(12時(日本時間)を過ぎていて、まだ投稿していないときだけ。判定はスクリプトが行う)
      # 投稿に失敗しても、再生回数の記録は続けてコミットする(次の毎時の実行で投稿し直す)
      - name: X に投稿
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/post-x.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

      # サイトのファイルを更新したとき(曲名や歌唱の手動修正を変えたときなど)は、
      # API を使わずに今の記録からページ用のデータを作り直してから公開する
      - name: ページ用のデータを作り直す
        if: github.event_name == 'push'
        run: node scripts/build-site.mjs

      - name: お試し実行の結果をログに出す
        if: inputs.dry_run
        run: |
          echo "=====DRY-RUN-DATA-BEGIN====="
          node -e 'const d=require("./data/state.json");const l=d.snapshots.at(-1);const p=d.snapshots.at(-2);console.log(JSON.stringify({videos:d.videos,snapshots:[p,l].filter(Boolean)}))'
          echo "=====DRY-RUN-DATA-END====="

      - name: お試し実行の結果を残す
        if: inputs.dry_run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dry-run-data
          path: |
            data/data.json
            data/state.json

      - name: 記録をコミット
        if: github.event_name != 'push' && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json data/state.json data/daily
          if [ -f data/x-post.json ]; then git add data/x-post.json; fi
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "再生回数を記録 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 公開するファイルをまとめる
        if: ${{ !inputs.dry_run }}
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'scripts' --exclude '_site' ./ _site/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: ${{ !inputs.dry_run }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ !inputs.dry_run }}
        with:
          path: _site

  # 2. アップロードしたファイルを GitHub Pages に公開する
  # (同じジョブ内で続けて公開すると、アップロード直後のファイルがまだ見えずに失敗することがあるため分ける)
  deploy:
    needs: update
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
