<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>学マスツール</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3f0;--card:#fff;--ink:#23212b;--mute:#79768a;--line:#e3dfe9;--vo:#e8456b;--da:#3a7bd5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16151c;--card:#232230;--ink:#f1eff6;--mute:#9a97a6;--line:#383648}}
:root[data-theme="dark"]{--bg:#16151c;--card:#232230;--ink:#f1eff6;--mute:#9a97a6;--line:#383648}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;max-width:560px;margin-inline:auto;padding:24px 16px 40px}
h1{margin:0 0 16px;font-size:22px}
.tool{display:flex;align-items:center;gap:12px;min-height:76px;padding:14px;margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ac);border-radius:12px;color:inherit;text-decoration:none}
.tool:hover,.tool:focus-visible{border-color:var(--ac)}
.tool:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.tx{flex:1;min-width:0}
.tool b{display:block;font-size:17px}
.tool span{display:block;margin-top:2px;font-size:13px;color:var(--mute)}
.tool svg{flex:none;color:var(--mute)}
footer{margin-top:24px;font-size:12px;color:var(--mute);text-align:center}
</style></head>
<body>
<main>
<h1>学マスツール</h1>
<a class="tool" href="ikusei.html" style="--ac:var(--vo)"><div class="tx"><b>育成シミュ</b><span>週ごとの行動から最終ステータスを予測し、目標に届く選び方を提案します</span></div><svg viewBox="0 0 10 16" width="10" height="16" aria-hidden="true"><path d="m2 2 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
<a class="tool" href="score-memo.html" style="--ac:var(--da)"><div class="tx"><b>スコアメモ</b><span>シーズンごとのスコアを記録し、平均と順位を自動で計算します</span></div><svg viewBox="0 0 10 16" width="10" height="16" aria-hidden="true"><path d="m2 2 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
</main>
<footer>本サイトは非公式のファンメイドツールです。<br>「学園アイドルマスター」の公式とは一切関係ありません。</footer>
</body></html>
