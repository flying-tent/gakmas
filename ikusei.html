<!doctype html>
<html lang="ja"><head><meta charset="utf-8">

<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{--bg:#f5f3f0;--card:#fff;--ink:#23212b;--mute:#79768a;--line:#e3dfe9;--vo:#e8456b;--da:#3a7bd5;--vi:#d99a00;--ok:#16895a;--ng:#d6455d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#16151c;--card:#232230;--ink:#f1eff6;--mute:#9a97a6;--line:#383648;--ok:#4cc790;--ng:#ff7088}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;max-width:560px;margin-inline:auto;padding-bottom:96px}
.fr{display:flex;align-items:center;gap:10px}
.dot{width:26px;height:26px;border-radius:50%;flex:none;background:var(--ic,var(--line));border:1px solid var(--line)}
select,input,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 8px;min-width:0}
select{font-weight:700;font-size:16px}
#id{width:150px;height:54px;border-radius:999px;padding:0 14px;font-size:18px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#id{border:2px solid color-mix(in srgb,var(--ic,var(--line)) 80%,var(--mute));background:color-mix(in srgb,var(--ic,var(--card)) 16%,var(--card))}
main{padding:12px 12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:16px}
.g4{display:grid;grid-template-columns:44px repeat(3,1fr);gap:6px;align-items:center}
.g4 b{text-align:center;font-size:14px}.g4 i{font-style:normal;color:var(--mute);font-size:13px}
.g4 input{width:100%;text-align:center;padding:9px 2px}
.g4 .n{text-align:center;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.vo{color:var(--vo)}.da{color:var(--da)}.vi{color:var(--vi)}
.ok{color:var(--ok)}.ng{color:var(--ng)}
.nd{margin:0 0 8px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--ng) 10%,var(--card));font-size:13px;line-height:1.5}
.hn{margin:6px 0 0;font-size:12px;color:var(--mute)}
.g4 input::placeholder{color:var(--mute);opacity:.7;font-size:13px}
.rw{border-top:1px solid var(--line);padding:8px 0}
.rh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rh b{width:36px;font-variant-numeric:tabular-nums}
.ty{width:40px;font-weight:800;padding:6px 0;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--mute)}
.rh label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--mute)}
.rh label input{width:54px;padding:6px 2px;text-align:center;color:var(--ink);font-size:15px}
.rw.ey .gr{visibility:hidden}
.rh .lb{font-size:12px;color:var(--mute)}
.rh .lb em{font-style:normal;font-weight:700;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;margin-left:2px}
.cs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ce{display:flex;flex-direction:column;align-items:center;padding:6px 2px;border-width:2px;min-height:58px}
.ce .lv{font-size:12px;color:var(--mute)}
.ce em{font-style:normal;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.ce.k0.s1,.ce.k0.s2{border-color:var(--vo);background:color-mix(in srgb,var(--vo) 14%,var(--card))}
.ce.k1.s1,.ce.k1.s2{border-color:var(--da);background:color-mix(in srgb,var(--da) 14%,var(--card))}
.ce.k2.s1,.ce.k2.s2{border-color:var(--vi);background:color-mix(in srgb,var(--vi) 16%,var(--card))}
.ce.s2 .lv{font-weight:800;color:var(--ink)}
.sm{border-top:2px solid var(--line);margin-top:6px;padding-top:8px}
.sm.g4{row-gap:6px}
.rs{width:100%;margin-top:4px;padding:9px;color:var(--mute)}
.ce.sg{border-style:dashed}
.ce.sg.k0{border-color:color-mix(in srgb,var(--vo) 50%,var(--card));background:color-mix(in srgb,var(--vo) 6%,var(--card))}
.ce.sg.k1{border-color:color-mix(in srgb,var(--da) 50%,var(--card));background:color-mix(in srgb,var(--da) 6%,var(--card))}
.ce.sg.k2{border-color:color-mix(in srgb,var(--vi) 55%,var(--card));background:color-mix(in srgb,var(--vi) 7%,var(--card))}
.ce.sg em{opacity:.5}
.ex{grid-column:2/-1;width:100%}
.exn{grid-column:2/-1;font-size:12px;color:var(--mute);margin-top:-2px}
.rs.ask{color:var(--ng);font-weight:700}
#rs{width:auto;margin:0;padding:12px 18px;border-radius:999px;font-weight:700;color:var(--ink);border:2px solid color-mix(in srgb,var(--ic,var(--line)) 80%,var(--mute));box-shadow:0 4px 14px rgba(0,0,0,.18)}
#rs.ask{color:var(--ng);border-color:var(--ng)}
footer{padding:4px 16px 0;font-size:12px;color:var(--mute);text-align:center}
footer a{color:inherit}footer b{font-weight:700}footer p{margin:10px 0 0}
#fab{position:fixed;z-index:3;right:max(16px,calc((100vw - 560px)/2 + 16px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#menu{display:flex;flex-direction:column;align-items:flex-end;gap:10px;transition:opacity .15s,transform .15s}
#fab:not(.open) #menu{opacity:0;transform:translateY(10px);visibility:hidden;pointer-events:none}
#tg{width:54px;height:54px;padding:0;border-radius:50%;display:grid;place-items:center;border:2px solid color-mix(in srgb,var(--ic,var(--line)) 80%,var(--mute));box-shadow:0 4px 14px rgba(0,0,0,.18)}
#tg .up{display:flex;color:var(--ink)}#tg .up svg{display:block}#tg .x{display:none;font-size:26px;line-height:1;color:var(--mute)}
#fab.open #tg .up{display:none}#fab.open #tg .x{display:block}
#hp{padding:10px 18px;border-radius:999px;font-weight:700;border:2px solid color-mix(in srgb,var(--ic,var(--line)) 80%,var(--mute));box-shadow:0 4px 14px rgba(0,0,0,.18)}
/* 使い方ガイド */
#gd{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,8,16,.5);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.gp{width:100%;max-width:520px;max-height:100%;overflow:auto;background:var(--card);color:var(--ink);border-radius:20px 20px 0 0;border-top:5px solid var(--ic,var(--line));padding:18px 18px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
@media(min-width:600px){#gd{align-items:center}.gp{border-radius:20px;border:1px solid var(--line);border-top:5px solid var(--ic,var(--line));padding-bottom:18px}}
.gtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gst{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--mute);font-variant-numeric:tabular-nums}
.gsk{border:none;background:none;color:var(--mute);font-size:14px;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}
.gp h3{margin:0;font-size:20px;line-height:1.35;text-wrap:balance}
.gb{margin:0;font-size:15px;line-height:1.7}
.gb b{font-weight:700}
.gl{margin:0;padding-left:1.2em;font-size:15px;line-height:1.7;display:flex;flex-direction:column;gap:4px}
.gdm{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;pointer-events:none}
.gdm .cap{font-size:12px;color:var(--mute);margin-top:6px;text-align:center}
.gdm .rh{margin-bottom:6px}
.gdm .ce,.gdm .ty{border:2px solid var(--line);border-radius:10px;background:var(--card);text-align:center}
.gdm .ty{border-width:1px}
.gdm .ce.sg{border-style:dashed}
.gdm .g4 .n{font-size:16px}
.gdm .fk{display:block;width:100%;text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px 2px;background:var(--card);font-variant-numeric:tabular-nums}
.gdt{display:flex;justify-content:center;gap:6px}
.gdt i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:width .2s,background .2s}
.gdt i.on{width:20px;border-radius:4px;background:color-mix(in srgb,var(--ic,var(--ink)) 70%,var(--ink))}
.gnv{display:flex;gap:8px}
.gnv button{flex:1;padding:12px;border-radius:12px;font-weight:700}
#gnx{background:var(--ink);color:var(--card);border-color:var(--ink)}
#gpv[disabled]{opacity:.35}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid color-mix(in srgb,var(--ic,var(--ink)) 70%,var(--ink));outline-offset:2px}
@media(prefers-reduced-motion:reduce){.gdt i,#menu{transition:none}}
</style></head>
<body>
<div id="fab"><div id="menu"><button id="hp">？ 使い方</button><button class="rs" id="rs">↺ リセット</button></div><div class="fr"><select id="id" aria-label="育成するアイドル"></select><button id="tg" aria-label="メニュー" aria-expanded="false"><span class="up" aria-hidden="true"><svg viewBox="0 0 16 10" width="22" height="14"><path d="M2 8 8 2l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="x" aria-hidden="true">×</span></button></div></div>
<main id="app"></main>
<div id="gd" hidden role="dialog" aria-modal="true" aria-labelledby="gh"><div class="gp">
<div class="gtop"><span class="gst" id="gst"></span><button class="gsk" id="gsk">スキップ</button></div>
<h3 id="gh"></h3><div id="gbd" style="display:flex;flex-direction:column;gap:12px"></div>
<div class="gdt" id="gdt" aria-hidden="true"></div>
<div class="gnv"><button id="gpv">戻る</button><button id="gnx">次へ</button></div>
</div></div>
<footer><b>参考</b><br><a href="https://seesaawiki.jp/gakumasu/d/N.I.A/%A5%DE%A5%B9%A5%BF%A1%BC" target="_blank" rel="noopener">学園アイドルマスターwiki「N.I.A/マスター」</a><p>本ツールは非公式のファンメイドツールです。<br>「学園アイドルマスター」の公式とは一切関係ありません。</p></footer>
<script>
const SEED=[{"n":"清夏"},{"n":"ことね"},{"n":"咲季"},{"n":"広"},{"n":"広元"},{"n":"千奈"},{"n":"麻央"},{"n":"莉波"},{"n":"佑芽"},{"n":"手毬"},{"n":"美鈴"},{"n":"リーリヤ"},{"n":"星南"},{"n":"燕"}];
const $=id=>document.getElementById(id),KEY="gakumas-ikusei-v1";
// N.I.A 審査基準の○最低値 [得意,普通,苦手]（学マスwiki N.I.A/マスター より。"?"付きは誤差大）
const EXAM=[["メロBang!","ハーモニーToNight","MusicOrder"],["GALAXYミュージック","POPFair","MELODYJourney"],["FINALE","QUARTET","IDOLBigup!","SingleCut"]];
const OK={B:{"メロBang!":"311?,252?,147?","ハーモニーToNight":"282?,234?,136?","MusicOrder":"258?,205?,129?","GALAXYミュージック":"826,657,395","POPFair":"780?,624?,373","MELODYJourney":"738?,585?,355?","FINALE":"1428,1136,682","QUARTET":"1203,957,575","IDOLBigup!":"1131?,904?,548?","SingleCut":"1054?,874?,536?"},
 P:{"メロBang!":"349,217?,134?","ハーモニーToNight":"335?,212?,135?","MusicOrder":"298?,212?,114?","GALAXYミュージック":"941,584,358","POPFair":"890?,559?,339?","MELODYJourney":"840?,547?,318?","FINALE":"1628,1009,619","QUARTET":"1371,850,522","IDOLBigup!":"1286?,801?,501?","SingleCut":"1203?,786?,483?"}};
// 審査基準タイプと 得意→普通→苦手 の並び（0=Vo,1=Da,2=Vi）
const JT={"咲季":["B",[2,1,0]],"手毬":["P",[0,1,2]],"ことね":["P",[1,2,0]],"麻央":["P",[0,2,1]],"リーリヤ":["B",[2,1,0]],"千奈":["P",[1,2,0]],"清夏":["P",[1,2,0]],"広":["B",[0,1,2]],"広元":["B",[0,1,2]],"星南":["B",[2,0,1]],"美鈴":["P",[0,2,1]],"佑芽":["B",[1,0,2]],"莉波":["B",[2,1,0]]};
const okv=(n,e)=>{const j=JT[n];if(!j)return null;const a=OK[j[0]][e].split(","),r=["","",""];let u=false;j[1].forEach((k,i)=>{u=u||a[i].includes("?");r[k]=a[i].replace("?","")});return{r,u}};
const COL={"清夏":"#7cfc00","ことね":"#f8c112","咲季":"#e30f25","広":"#00afcc","広元":"#00afcc","千奈":"#f68b1f","麻央":"#7f1184","莉波":"#f6adc6","佑芽":"#ea533a","手毬":"#0c7bbb","美鈴":"#7a99cf","リーリヤ":"#eafdff","星南":"#f6ae54","燕":"#7b68ee"};
const paint=()=>{if(COL[cur])document.documentElement.style.setProperty("--ic",COL[cur]);$("rs").title=cur+"の入力を空欄に戻す"};
const T0=[["レ",80,100],["営",80,0],["レ",80,100],["営",80,0],["営",80,0],["レ",100,120],["営",110,0],["レ",100,120],["営",110,0],["レ",120,150],["営",130,0],["レ",120,150],["営",130,0],["レ",120,150]];
const DT=["1/8","1/7","1/5","1/4","1/2","2/6","2/5","2/3","2/2","3/7","3/6","3/4","3/3","3/2"];
const RG=[[0,5],[5,9],[9,14]],NA=["Vo","Da","Vi"],CL=["vo","da","vi"];
const sv=v=>v==null?"":String(v);
let D={},cur=SEED[0].n;
try{const x=JSON.parse(localStorage.getItem(KEY));if(x){D=x.D||{};if(x.cur)cur=x.cur;if(x.pv!=2)Object.values(D).forEach(o=>{o.m=o.m.map(v=>v===""?"":String(+(parseFloat(v)*100).toFixed(3)))})}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({D,cur,pv:2}))}catch(e){}}
function fresh(n){return{s:["","",""],m:["","",""],t:["","","","","",""],t0:["","",""],r1:["","",""],r2:["","",""],w:T0.map(r=>[...r,0,0,0])}}
const d=()=>{const o=D[cur]||(D[cur]=fresh(cur));if(!o.t0)o.t0=["","",""];if(!o.ex)o.ex=["","",""];o.w.forEach((w,i)=>{w[0]=T0[i][0];w[1]=T0[i][1];w[2]=T0[i][2];if(w[0]=="営")[3,4,5].forEach(j=>{if(w[j]>1)w[j]=1})});if(!o.exv){o.exv=1;if(JT[cur])[0,1,2].forEach(bi=>applyEx(o,bi,EXAM[bi][0]))}return o};
function applyEx(x,bi,e){x.ex[bi]=e;const v=e&&okv(cur,e);if(v)v.r.forEach((val,k)=>{if(bi)x.t[(bi-1)*3+k]=val;else x.t0[k]=val})}
const tgv=(x,bi,k)=>nn(bi?x.t[(bi-1)*3+k]:x.t0[k]);
const nn=v=>{const x=parseInt(String(v).replace(/\D/g,""),10);return isNaN(x)?null:x};
const th=()=>NA.map((n,k)=>`<b class="${CL[k]}">${n}</b>`).join("");
const inp=(f,k,m,ph)=>`<input data-f="${f}" data-k="${k}" inputmode="${m||"numeric"}"${ph?` placeholder="${ph}"`:""} value="${d()[f][k]}">`;
const trio=(f,m,ph)=>[0,1,2].map(k=>inp(f,k,m,ph)).join("");
const ids=(p,bi)=>[0,1,2].map(k=>`<span class="n" id="${p}${bi}_${k}"></span>`).join("");
function rowH(i){const w=d().w[i];
 return `<div class="rw" id="w${i}"><div class="rh"><b>${DT[i]}</b><span class="ty">${w[0]}</span><span class="lb">成功 <em>${w[1]}</em></span><span class="lb gr">大成功 <em>${w[2]}</em></span></div><div class="cs">${[0,1,2].map(k=>`<button class="ce k${k}" id="c${i}_${k}" data-i="${i}" data-k="${k}"><span class="lv"></span><em id="g${i}_${k}"></em></button>`).join("")}</div></div>`}
function render(){
 const x=d();
 let h=`<div class="card"><h2>初期ステータス / 補正倍率</h2><div class="g4"><i></i>${th()}<i>ステ</i>${trio("s","numeric","例 110")}<i>補正%</i>${trio("m","decimal","例 50.6")}</div></div>`;
 RG.forEach(([a,b],bi)=>{
  h+=`<div class="card"><h2>${bi+1}次まで</h2>`;
  for(let i=a;i<b;i++)h+=rowH(i);
  h+=`<div class="sm g4"><i></i>${th()}<i>予測</i>${ids("p",bi)}`;
  h+=`<i>試験</i><select class="ex" data-ex="${bi}"><option value="">手入力</option>${JT[cur]?EXAM[bi].map(e=>`<option${x.ex[bi]==e?" selected":""} value="${e}">${e}</option>`).join(""):""}</select>${JT[cur]?"":`<span class="exn">${cur}は審査基準が未判明なので手入力のみ</span>`}`;
  h+=`<i>目標</i>${[0,1,2].map(k=>bi?inp("t",(bi-1)*3+k,"text"):inp("t0",k,"text")).join("")}<i>差分</i>${ids("d",bi)}<i>提案後</i>${ids("q",bi)}`;
  if(bi<2)h+=`<i>結果</i>${[0,1,2].map(k=>inp("r"+(bi+1),k)).join("")}`;
  h+=`</div></div>`});
 $("app").innerHTML=h;calc();
}
function mkg(x){const m=x.m.map(v=>(parseFloat(v)||0)/100);return(w,k,st)=>{if(!st)return 0;const b=+(st==1?w[1]:w[2])||0;return w[0]=="レ"?Math.floor(b*(1+m[k])+1e-9):b}}
function chain(x,st,g){let base=x.s.map(v=>+v||0),P=[];
 RG.forEach(([a,b],bi)=>{const p=[0,1,2].map(k=>{let t=base[k];for(let i=a;i<b;i++)t+=g(x.w[i],k,st(i,k));return t});P.push(p);
  if(bi<2){const r=bi?x.r2:x.r1;base=[0,1,2].map(k=>r[k]!==""?+r[k]||0:p[k])}});
 return P}
const freeRow=w=>!w[3]&&!w[4]&&!w[5];
const bk=i=>i<5?0:i<9?1:2;
function suggest(x,g){
 const asg={},pl={},rs={},st=(i,k)=>{const w=x.w[i];return freeRow(w)?(asg[i]===k?1:0):w[3+k]};
 const cl=i=>{const w=x.w[i];return bk(i)+w[0]+w[1]+"_"+w[2]};
 const key=rows=>{const c={};rows.forEach(i=>{(c[cl(i)]=c[cl(i)]||[]).push(asg[i])});return Object.keys(c).sort().map(k=>k+":"+c[k].sort().join("")).join("|")};
 const pass=(rows,au)=>{const T=[0,1,2].map(k=>tgv(x,au,k));if(!rows.length||T.every(v=>v==null))return false;
  let bs=1e9;const M=new Map(),tot=Math.pow(3,rows.length);
  for(let c=0;c<tot;c++){let z=c;rows.forEach(i=>{asg[i]=z%3;z=(z-z%3)/3});
   const P=chain(x,st,g)[au];let sh=0,mg=1e9;
   T.forEach((t,k)=>{if(t!=null){sh+=Math.max(0,t-P[k]);mg=Math.min(mg,P[k]-t)}});
   if(sh>bs)continue;if(sh<bs){bs=sh;M.clear()}
   const kk=key(rows),o=M.get(kk);if(!o||mg>o.mg)M.set(kk,{mg,a:rows.map(i=>asg[i])})}
  const L=[...M.values()].sort((a,b)=>b.mg-a.mg).slice(0,3).map(o=>({a:o.a,rows}));
  rows.forEach((i,j)=>asg[i]=L[0].a[j]);pl[au]=L;
  const U={};L.forEach(p=>rows.forEach((i,j)=>{(U[cl(i)]=U[cl(i)]||new Set()).add(p.a[j])}));
  rows.forEach(i=>rs[i]=U[cl(i)]);return true};
 const fr=(a,b)=>{const o=[];for(let i=a;i<b;i++)if(freeRow(x.w[i]))o.push(i);return o};
 const r1ok=x.r1.every(v=>v!==""),ran0=r1ok?false:pass(fr(0,5),0);
 pass([...(r1ok||ran0?[]:fr(0,5)),...fr(5,9)],1);
 pass(fr(9,14),2);
