name: 再生回数を記録して公開

on:
  schedule:
    # 毎日 日本時間 0:17 ごろ(UTC 15:17)に実行。混雑時は遅れることがある
    - cron: "17 15 * * *"
  workflow_dispatch: # Actions画面から手動でも実行できる
  push:
    branches: [main] # サイトのファイルを更新したときは公開だけ行う

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event_name != 'push'
        with:
          node-version: 20

      - name: 再生回数を取得
        if: github.event_name != 'push'
        run: node scripts/fetch.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}

      - name: 記録をコミット
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "再生回数を記録 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
          fi

      - name: 公開するファイルをまとめる
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'scripts' --exclude '_site' ./ _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
