name: 再生回数を記録して公開

on:
  schedule:
    # 毎時7分ごろに実行。混雑時は遅れることがある
    - cron: "7 * * * *"
  workflow_dispatch: # Actions画面から手動でも実行できる
    inputs:
      dry_run:
        description: "お試し実行(記録も公開もせず、取得結果をファイルとして残すだけ)"
        type: boolean
        default: false
  push:
    branches: [main] # サイトのファイルを更新したときは公開だけ行う

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  # 1. 再生回数を記録して、公開するファイルをアップロードする
  update:
    runs-on: ubuntu-latest
    steps:
      # 起動時点ではなく、その時の最新の main を取り出す
      # (続けて起動されたとき、前の実行の記録コミットの上に積むため)
      # お試し実行のときは、起動したブランチのコードで動かす
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.dry_run && github.ref_name || 'main' }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: 再生回数を取得
        if: github.event_name != 'push'
        run: node scripts/fetch.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}

      # サイトのファイルを更新したとき(曲名や歌唱の手動修正を変えたときなど)は、
      # API を使わずに今の記録からページ用のデータを作り直してから公開する
      - name: ページ用のデータを作り直す
        if: github.event_name == 'push'
        run: node scripts/build-site.mjs

      - name: お試し実行の結果をログに出す
        if: inputs.dry_run
        run: |
          echo "=====DRY-RUN-DATA-BEGIN====="
          node -e 'const d=require("./data/state.json");const l=d.snapshots.at(-1);const p=d.snapshots.at(-2);console.log(JSON.stringify({videos:d.videos,snapshots:[p,l].filter(Boolean)}))'
          echo "=====DRY-RUN-DATA-END====="

      - name: お試し実行の結果を残す
        if: inputs.dry_run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dry-run-data
          path: |
            data/data.json
            data/state.json

      - name: 記録をコミット
        if: github.event_name != 'push' && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json data/state.json data/daily
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "再生回数を記録 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 公開するファイルをまとめる
        if: ${{ !inputs.dry_run }}
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'scripts' --exclude '_site' ./ _site/

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        if: ${{ !inputs.dry_run }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: ${{ !inputs.dry_run }}
        with:
          path: _site

  # 2. アップロードしたファイルを GitHub Pages に公開する
  # (同じジョブ内で続けて公開すると、アップロード直後のファイルがまだ見えずに失敗することがあるため分ける)
  deploy:
    needs: update
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
