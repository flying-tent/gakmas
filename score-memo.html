<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>学マス スコアメモ</title>
<style>
:root{--bg:#f5f3f0;--card:#fff;--ink:#23212b;--mute:#79768a;--line:#e3dfe9;--acc:#e8456b;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16151c;--card:#232230;--ink:#f1eff6;--mute:#9a97a6;--line:#383648}}
:root[data-theme="dark"]{--bg:#16151c;--card:#232230;--ink:#f1eff6;--mute:#9a97a6;--line:#383648}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif;max-width:560px;margin-inline:auto;padding-bottom:40px}
body[data-st="ロジック"]{--acc:#3a7bd5}
body[data-st="アノマリー"]{--acc:#d99a00;--on:#1f1700}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 12px 0;z-index:2}
.row{display:flex;gap:8px;margin-bottom:8px}
select,input,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
select{flex:1}#nn,#na{flex:1}
[hidden]{display:none!important}
.ib{flex:none;width:44px;padding:9px 0;font-weight:700}
#sp{margin-bottom:8px}
#sp .row{margin-bottom:6px}
#sd{border:0;background:none;color:var(--mute);font-size:13px;padding:4px 2px}
#sd.ask{color:#d33;font-weight:700}
button{cursor:pointer}
.tabs{display:flex;border-bottom:3px solid var(--acc)}
.tabs button{flex:1;border:0;border-radius:10px 10px 0 0;background:transparent;color:var(--mute);padding:11px 4px;font-weight:700}
.tabs button.on{background:var(--acc);color:var(--on)}
main{padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:12px;padding:10px;margin-bottom:10px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.nm{flex:1;font-weight:700;font-size:17px}
.avg{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.rk{min-width:34px;text-align:center;border-radius:8px;padding:2px 6px;font-weight:800;background:var(--line);color:var(--mute)}
.rk.t1{background:var(--acc);color:var(--on)}
.rk.t2{background:color-mix(in srgb,var(--acc) 45%,var(--card));color:var(--ink)}
.rk.t3{background:color-mix(in srgb,var(--acc) 22%,var(--card));color:var(--ink)}
.card.t1,.card.t2,.card.t3{background:color-mix(in srgb,var(--acc) 12%,var(--card))}
.kk{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--mute);font-size:14px}
.kk button{padding:7px 18px;font-weight:700}
.kk button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.del{border:0;background:none;color:var(--mute);padding:4px 6px}
.del.ask{color:#d33;font-weight:700}
.sc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sc input{width:100%;text-align:center;padding:10px 2px;font-size:16px;font-variant-numeric:tabular-nums}
.sc input:focus{outline:2px solid var(--acc);border-color:var(--acc)}
.tools{display:flex;gap:8px;margin-top:4px}
.tools button{flex:1}
#cp{width:100%;height:120px;margin-top:8px;display:none}
.hint{color:var(--mute);font-size:13px;margin:8px 2px}
#hp{flex:none;width:44px;padding:0;display:grid;place-items:center;color:var(--mute)}
#hp svg{display:block}
/* 使い方ガイド */
#gd{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,8,16,.5);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.gp{width:100%;max-width:520px;max-height:100%;overflow:auto;background:var(--card);color:var(--ink);border-radius:20px 20px 0 0;border-top:5px solid var(--acc);padding:18px 18px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
@media(min-width:600px){#gd{align-items:center}.gp{border-radius:20px;border:1px solid var(--line);border-top:5px solid var(--acc);padding-bottom:18px}}
.gtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gst{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--mute);font-variant-numeric:tabular-nums}
.gsk{border:none;background:none;color:var(--mute);font-size:14px;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}
.gp h3{margin:0;font-size:20px;line-height:1.35;text-wrap:balance}
.gb{margin:0;font-size:15px;line-height:1.7}
.gb b,.gl b{font-weight:700}
.gl{margin:0;padding-left:1.2em;font-size:15px;line-height:1.7;display:flex;flex-direction:column;gap:4px}
.gdm{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;pointer-events:none;display:flex;flex-direction:column;gap:8px}
.gdm .cap{font-size:12px;color:var(--mute);text-align:center}
.gdm .card{margin:0}
.gdm .row{margin:0}
.fk{display:block;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--card);font-variant-numeric:tabular-nums;min-width:0}
.gdm .sc .fk{text-align:center;padding:10px 2px;font-size:15px}
.gdm .sc .fk.e{color:var(--mute)}
.gdm .tabs span{flex:1;text-align:center;border-radius:10px 10px 0 0;color:var(--mute);padding:9px 4px;font-weight:700;font-size:14px}
.gdm .tabs span.on{background:var(--acc);color:var(--on)}
.gdm .kk{margin:0}
.gdm .kk span.b{border:1px solid var(--line);border-radius:10px;padding:5px 14px;font-weight:700;background:var(--card);color:var(--ink)}
.gdm .kk span.b.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gdm .top{margin:0}
.gdt{display:flex;justify-content:center;gap:6px}
.gdt i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:width .2s,background .2s}
.gdt i.on{width:20px;border-radius:4px;background:var(--acc)}
.gnv{display:flex;gap:8px}
.gnv button{flex:1;padding:12px;border-radius:12px;font-weight:700}
#gnx{background:var(--ink);color:var(--card);border-color:var(--ink)}
#gpv[disabled]{opacity:.35}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.gdt i{transition:none}}
</style></head>
<body>
<header>
 <div class="row"><select id="ss" aria-label="シーズン"></select><button class="ib" id="se" aria-label="シーズン名の変更・削除" title="シーズン名の変更・削除">✎</button><button class="ib" id="sa" aria-label="シーズンを追加" title="シーズンを追加">＋</button><button id="hp" aria-label="使い方" title="使い方"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.4 9.3a2.7 2.7 0 0 1 5.2 1c0 1.8-2.6 2.3-2.6 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17.6" r="1.1" fill="currentColor"/></svg></button></div>
 <div id="sp" hidden><div class="row"><input id="nn" aria-label="シーズン名"><button id="nw">作成</button><button id="sx">閉じる</button></div><button id="sd">このシーズンを削除</button></div>
 <div class="kk"><span>色付け</span><button data-k="2">2位まで</button><button data-k="3">3位まで</button></div>
 <div class="tabs" id="tb"></div>
</header>
<main>
 <div id="ls"></div>
 <div class="row"><input id="na" placeholder="アイドル名を追加"><button id="ad">追加</button></div>
 <div class="tools"><button id="cb">表をコピー（Excel用）</button></div>
 <textarea id="cp" readonly></textarea>
 <p class="hint" id="ms">データはこの端末のブラウザに保存されます。</p>
</main>
<div id="gd" hidden role="dialog" aria-modal="true" aria-labelledby="gh"><div class="gp">
<div class="gtop"><span class="gst" id="gst"></span><button class="gsk" id="gsk">スキップ</button></div>
<h3 id="gh"></h3><div id="gbd" style="display:flex;flex-direction:column;gap:12px"></div>
<div class="gdt" id="gdt" aria-hidden="true"></div>
<div class="gnv"><button id="gpv">戻る</button><button id="gnx">次へ</button></div>
</div></div>
<script>
const ST={"センス":["ことね","莉波","麻央","手毬","咲季","千奈","清夏","リーリヤ"],"ロジック":["ことね","佑芽","広","咲季","千奈","リーリヤ","星南"],"アノマリー":["星南","広","麻央","ことね","清夏","佑芽"]};
const KEY="gakumas-score-memo-v1",N=5,$=id=>document.getElementById(id);
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
function today(){const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")}
if(!S||!S.seasons||!S.seasons.length)S={cur:0,st:"センス",seasons:[{name:today(),s:{}}],idols:JSON.parse(JSON.stringify(ST))};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
// 以前の初期名（末尾の「セ」「好」）を、保存済みのスコアごと新しい名前へ移す
if(!S.nv){const RN={"センス":{"ことねセ":"ことね","咲季セ":"咲季","千奈セ":"千奈"},"ロジック":{"ことね好":"ことね","咲季好":"咲季"}};
 Object.entries(RN).forEach(([st,m])=>{const L=S.idols[st];if(!L)return;Object.entries(m).forEach(([o,n])=>{if(!L.includes(o)||L.includes(n))return;L[L.indexOf(o)]=n;
  S.seasons.forEach(se=>{if(se.s[st+"|"+o]){se.s[st+"|"+n]=se.s[st+"|"+o];delete se.s[st+"|"+o]}})})});
 S.nv=1;save()}
if(S.nv<2){const st="アノマリー",L=S.idols[st];
 if(L){const has=n=>S.seasons.some(se=>(se.s[st+"|"+n]||[]).some(v=>v!==""));
  if(L.includes("雨ことね")&&!L.includes("ことね")){L[L.indexOf("雨ことね")]="ことね";S.seasons.forEach(se=>{if(se.s[st+"|雨ことね"]){se.s[st+"|ことね"]=se.s[st+"|雨ことね"];delete se.s[st+"|雨ことね"]}})}
  if(L.includes("Gことね")&&L.includes("ことね")&&!has("Gことね"))S.idols[st]=L.filter(x=>x!="Gことね")}
 S.nv=2;save()}
const cur=()=>S.seasons[S.cur];
const kn=()=>cur().k||3;
const row=(st,n)=>{const s=cur().s;return s[st+"|"+n]||(s[st+"|"+n]=Array(N).fill(""))};
const avgOf=a=>{const v=a.map(x=>parseInt(x,10)).filter(x=>!isNaN(x));return v.length?v.reduce((p,c)=>p+c,0)/v.length:null};
function head(){
 $("ss").innerHTML=S.seasons.map((x,i)=>`<option value="${i}">${x.name.replace(/[<&]/g,"")}</option>`).join("");
 $("ss").value=S.cur;
 $("tb").innerHTML=Object.keys(ST).map(k=>`<button data-k="${k}" class="${k==S.st?"on":""}">${k}</button>`).join("");
 document.body.dataset.st=S.st;
 $("cb").textContent=S.st+"の表をコピー（Excel用）";
 document.querySelectorAll(".kk button").forEach(b=>b.classList.toggle("on",+b.dataset.k==kn()));
}
function list(){
 $("ls").innerHTML="";
 S.idols[S.st].forEach(n=>{
  const r=row(S.st,n),c=document.createElement("div");c.className="card";c.dataset.n=n;
  c.innerHTML=`<div class="top"><span class="nm"></span><span class="avg">0.0</span><span class="rk">0位</span><button class="del" aria-label="削除">✕</button></div><div class="sc"></div>`;
  c.querySelector(".nm").textContent=n;
  const g=c.querySelector(".sc");
  r.forEach((v,i)=>{const e=document.createElement("input");e.inputMode="numeric";e.pattern="[0-9]*";e.placeholder=i+1;e.value=v;e.setAttribute("aria-label",n+" "+(i+1)+"回目");
   e.oninput=()=>{e.value=e.value.replace(/\D/g,"");r[i]=e.value;save();stats()};g.appendChild(e)});
  const d=c.querySelector(".del");
  d.onclick=()=>{if(!d.classList.contains("ask")){d.classList.add("ask");d.textContent="削除";setTimeout(()=>{d.classList.remove("ask");d.textContent="✕"},2500);return}
   S.idols[S.st]=S.idols[S.st].filter(x=>x!=n);save();list()};
  $("ls").appendChild(c)});
 stats();
}
function stats(){
 const cs=[...$("ls").children],av=cs.map(c=>avgOf(row(S.st,c.dataset.n)));
 const vs=av.map(a=>a===null?0:a),sorted=[...vs].sort((a,b)=>b-a),z=vs.every(a=>!a);
 cs.forEach((c,i)=>{const a=av[i],rk=c.querySelector(".rk");
  c.querySelector(".avg").textContent=a===null?"0.0":a.toFixed(1);
  const p=sorted.indexOf(vs[i])+1;rk.textContent=p+"位";const t=!z&&a!==null&&p<=kn()?"t"+p:"";rk.className="rk "+t;c.className="card "+t});
}
function say(t){$("ms").textContent=t}
document.querySelector(".kk").onclick=e=>{const k=+e.target.dataset.k;if(k){cur().k=k;save();head();stats()}};
$("ss").onchange=e=>{S.cur=+e.target.value;save();head();list()};
$("tb").onclick=e=>{const k=e.target.dataset.k;if(k){S.st=k;save();head();list()}};
let sm="new",sdT;
const sdOff=()=>{clearTimeout(sdT);$("sd").classList.remove("ask");$("sd").textContent="このシーズンを削除"};
function spOpen(m){sm=m;sdOff();$("sp").hidden=false;$("nn").value=m=="ren"?cur().name:"";
 $("nn").placeholder=m=="new"?"新しいシーズン名（空なら今日の日付）":"シーズン名";
 $("nw").textContent=m=="new"?"作成":"変更";$("sd").hidden=m!="ren"||S.seasons.length<2;$("nn").focus()}
const spClose=()=>{$("sp").hidden=true;sdOff()};
$("sa").onclick=()=>$("sp").hidden||sm!="new"?spOpen("new"):spClose();
$("se").onclick=()=>$("sp").hidden||sm!="ren"?spOpen("ren"):spClose();
$("sx").onclick=spClose;
$("nn").onkeydown=e=>{if(e.key=="Enter")$("nw").click();else if(e.key=="Escape")spClose()};
const uniq=(n,skip)=>{let m=n,i=2;while(S.seasons.some((x,j)=>j!==skip&&x.name==m))m=n+"-"+i++;return m};
$("nw").onclick=()=>{const v=$("nn").value.trim();
 if(sm=="new"){S.seasons.unshift({name:uniq(v||today()),s:{},k:kn()});S.cur=0}
 else if(v)cur().name=uniq(v,S.cur);
 save();head();list();spClose()};
$("sd").onclick=()=>{const b=$("sd");if(!b.classList.contains("ask")){b.classList.add("ask");b.textContent="もう一度タップで「"+cur().name+"」を削除";clearTimeout(sdT);sdT=setTimeout(sdOff,2500);return}
 S.seasons.splice(S.cur,1);S.cur=0;save();head();list();spClose()};
$("ad").onclick=()=>{const n=$("na").value.trim();if(!n||S.idols[S.st].includes(n))return;S.idols[S.st].push(n);$("na").value="";save();list()};
$("cb").onclick=async()=>{
 const t=["アイドル",...Array.from({length:N},(_,i)=>i+1),"平均","順位"].join("\t")+"\n"+
 [...$("ls").children].map(c=>{const n=c.dataset.n,r=row(S.st,n),a=avgOf(r);return [n,...r,a===null?"0.0":a.toFixed(1),c.querySelector(".rk").textContent.replace("–","")].join("\t")}).join("\n");
 try{await navigator.clipboard.writeText(t);say("コピーしました。Excelに貼り付けてください。")}
 catch(e){const x=$("cp");x.style.display="block";x.value=t;x.focus();x.select();say("下の文章を長押ししてコピーしてください。")}
};
head();list();
// ---- 初回の使い方ガイド ----
const GKEY="gakumas-score-memo-guide-v1";
const mini=(n,a,p)=>`<div class="card${p&&p<=3?" t"+p:""}"><div class="top"><span class="nm">${n}</span><span class="avg">${a}</span><span class="rk${p&&p<=3?" t"+p:""}">${p}位</span></div></div>`;
const GS=[
 {h:"学マス スコアメモへようこそ",b:`<p class="gb">アイドルごとに<b>スコアを5回分</b>記録して、平均と順位を出すメモです。</p><ul class="gl"><li>シーズンごとに記録を分けて保存</li><li>センス・ロジック・アノマリーのプラン別に管理</li><li>平均の高い順に順位と色付けを表示</li></ul>`},
 {h:"シーズンを用意する",b:`<div class="gdm"><div class="row" style="gap:8px"><span class="fk" style="flex:1">20261109</span><span class="fk" style="width:44px;text-align:center;font-weight:700">✎</span><span class="fk" style="width:44px;text-align:center;font-weight:700">＋</span></div><div class="cap">例：記録するシーズンを選ぶ欄と、編集・追加のボタン</div></div><ul class="gl"><li>シーズン名の欄で、記録するシーズンを切り替え</li><li><b>＋</b>で新しいシーズンを作成（名前が空なら今日の日付）</li><li><b>✎</b>で今のシーズンの名前を変更。不要なシーズンの削除もここから</li></ul>`},
 {h:"プランを選んでスコアを入力",b:`<div class="gdm"><div class="tabs"><span class="on">センス</span><span>ロジック</span><span>アノマリー</span></div><div class="card t1"><div class="top"><span class="nm">莉波</span><span class="avg">1541.3</span><span class="rk t1">1位</span></div><div class="sc"><span class="fk">1520</span><span class="fk">1480</span><span class="fk">1610</span><span class="fk">1555</span><span class="fk e">5</span></div></div><div class="cap">例：入力した回だけで平均を計算（数値は例）</div></div><p class="gb">タブでプランを選び、アイドルのカードにスコアを入れます。5回すべて埋めなくても平均が出ます。</p>`},
 {h:"平均と順位を見る",b:`<div class="gdm"><div class="kk"><span>色付け</span><span class="b">2位まで</span><span class="b on">3位まで</span></div>${mini("莉波","1541.3",1)}${mini("手毬","1502.0",2)}${mini("清夏","1488.5",3)}${mini("麻央","1420.8",4)}</div><p class="gb">平均の高い順に順位がつきます。<b>色付け</b>で、上位2位か3位までを色付けするか選べます。スコア未入力のアイドルは0点として順位を出します。</p>`},
 {h:"アイドルの追加・削除とコピー",b:`<ul class="gl"><li>一覧の下の欄に名前を入れて<b>追加</b></li><li>カード右上の<b>✕</b>を2回タップで削除</li><li><b>表をコピー</b>で、表示中のプランの表をExcelにそのまま貼れる形式でコピー</li><li>このガイドは右上の丸で囲んだ<b>？</b>ボタンからいつでも見られます</li></ul>`}
];
let gi=0;
function gShow(i){gi=i;const s=GS[i],last=i==GS.length-1;
 $("gst").textContent=`${i+1} / ${GS.length}`;$("gh").textContent=s.h;$("gbd").innerHTML=s.b;
 $("gdt").innerHTML=GS.map((_,j)=>`<i${j==i?' class="on"':""}></i>`).join("");
 $("gpv").disabled=i==0;$("gnx").textContent=last?"はじめる":"次へ";$("gsk").hidden=last}
function gOpen(){gShow(0);$("gd").hidden=false;$("gnx").focus()}
function gClose(){$("gd").hidden=true;try{localStorage.setItem(GKEY,"1")}catch(e){}$("hp").focus()}
$("gnx").onclick=()=>gi<GS.length-1?gShow(gi+1):gClose();
$("gpv").onclick=()=>gi>0&&gShow(gi-1);
$("gsk").onclick=gClose;
$("hp").onclick=gOpen;
$("gd").addEventListener("click",e=>{if(e.target.id=="gd")gClose()});
document.addEventListener("keydown",e=>{if($("gd").hidden)return;
 if(e.key=="Escape")gClose();else if(e.key=="ArrowRight"&&gi<GS.length-1)gShow(gi+1);else if(e.key=="ArrowLeft"&&gi>0)gShow(gi-1)});
{let sx=null;const p=document.querySelector(".gp");
 p.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
 p.addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;
  if(dx<-50&&gi<GS.length-1)gShow(gi+1);else if(dx>50&&gi>0)gShow(gi-1)})}
{let seen=false;try{seen=localStorage.getItem(GKEY)=="1"}catch(e){}if(!seen)gOpen()}
</script>
</body></html>
